# CI exists because this repo's two suites were host-dependent and nobody noticed.
#
# `bun test` and the Playwright suite both boot code that reads the developer's
# `.env`, which on a real machine carries instance-profile flags — the Mac mini
# runs with `MUNINN_WIKI_READONLY=1`, the laptop does not. The same tree was green
# on one and red on the other, twice (45 `bun test` failures, then 23 e2e ones),
# and each time it was diagnosed by hand months apart. A runner has NO `.env` at
# all, so it is the only place the suites are pinned to what the repo actually
# says rather than to whoever ran them last.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the old run on the same ref. `main` is excluded from the
# cancel so a merge always gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned rather than `latest`: a Bun release changing `bun test`'s behaviour
  # should turn up as a deliberate bump in this file, not as an unexplained red
  # on an unrelated PR. Keep in step with the version developers run.
  BUN_VERSION: "1.3.10"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      # `src/test/setup-db.ts` hardcodes `…@127.0.0.1:5435/muninn_test`, so the
      # host port has to be 5435 — it is not configurable from here. pgvector,
      # not plain postgres: `db/init.sql` creates the `vector` extension for the
      # memory embeddings.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: muninn
          POSTGRES_PASSWORD: muninn
          POSTGRES_DB: muninn
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U muninn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `muninn_test`, matching the `e2e` job. `db:setup:test` applies `db/init.sql`
      # to `muninn_test` ONLY, so the service's `muninn` database is created empty
      # and never initialised — pointing `DATABASE_URL` there gave any test that
      # goes through `loadConfig()` + `getDb()` (rather than `src/test/setup-db.ts`)
      # a SCHEMA-LESS database on CI and a fully migrated one on a developer's
      # machine. That is the host-dependence this workflow exists to catch,
      # reintroduced in the workflow itself.
      DATABASE_URL: postgresql://muninn:muninn@127.0.0.1:5435/muninn_test
      LOG_DIR: none
    steps:
      - uses: actions/checkout@v4
        with:
          # `src/wiki/git-dates.test.ts` asserts against THIS REPO'S OWN history —
          # that `store.ts` carries a non-sweep touch date. `checkout`'s default
          # depth-1 clone has exactly one commit, which is large enough to be
          # classified as a SWEEP, so `touched` came back empty and the assertion
          # failed on the runner and nowhere else. Full history is the input that
          # test needs; loosening the assertion instead would delete its point.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Creates `muninn_test`, applies `db/init.sql` and baselines the migrations.
      # The `src/db/` links of the test chain connect to it directly.
      - run: bun run db:setup:test
      # The full chain, exactly as a developer runs it — including the `&&`-linked
      # single-file links, which exist because `mock.module` leaks across a whole
      # `bun test` process (see CLAUDE.md, Testing).
      - run: bun run test

  # The image's two build ARGs decide what a deployment CAN do, and neither is
  # visible to tsc or to any suite (rationale for the pair: the Dockerfile).
  # TWO builds, not three: the default image is built once with a plain log the
  # bots/ assertion reads, and every image-content check runs against it.
  docker-build:
    runs-on: ubuntu-latest
    # The claude.ai installer and the Debian mirrors are on this job's critical
    # path, so a hung mirror must not hold a PR open for six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # `docker build` on the runner image is BuildKit, the same engine the
      # `COPY bot[s]` glob behaviour was measured on. `--progress=plain` so the
      # build's own RUN output survives into build.log.
      - name: Build the default image (no build args)
        run: docker build --progress=plain -t muninn:default . 2>&1 | tee build.log
      - name: Default image carries ffmpeg AND the Claude CLI
        # `--entrypoint` because the image's ENTRYPOINT is the migrate-then-serve
        # script; without it these words would be arguments to a booting server.
        run: |
          docker run --rm --entrypoint sh muninn:default -c 'command -v ffmpeg' \
            || { echo "::error::ffmpeg missing from the DEFAULT image — docker-compose's capture verticals need it"; exit 1; }
          docker run --rm --entrypoint sh muninn:default -c 'command -v claude' \
            || { echo "::error::the Claude CLI is missing from the DEFAULT image — resolveConnector falls back to claude-cli"; exit 1; }
      - name: The bots/ glob tolerates a context with no bot folder, and says so
        # This repo's `.dockerignore` excludes `bots/`, so EVERY build here is the
        # no-bot-folder case — which is the half the public repo can test. The
        # positive case (a context that does ship bot folders) belongs to the
        # internal deploy repo, which carries its own dockerignore.
        run: |
          grep -q "no bots/ in the build context" build.log \
            || { echo "::error::the bots/ COPY check did not report the empty-context case"; exit 1; }
          # And the image really has no bot folders — a COPY form that silently
          # copied nothing and a COPY form that worked look identical from the
          # build log alone.
          test -z "$(docker run --rm --entrypoint sh muninn:default -c 'ls -A ./bots 2>/dev/null')" \
            || { echo "::error::bots/ landed in an image built from a context that excludes it"; exit 1; }
      - name: The image pins the port and the bind address the probe assumes
        run: |
          ENVS=$(docker inspect --format '{{json .Config.Env}}' muninn:default)
          echo "$ENVS" | grep -q 'DASHBOARD_PORT=3000' \
            || { echo "::error::the image does not pin DASHBOARD_PORT=3000 — the app defaults to 3010 and the HEALTHCHECK probes 3000"; exit 1; }
          echo "$ENVS" | grep -q 'DASHBOARD_HOST=0.0.0.0' \
            || { echo "::error::the image does not pin DASHBOARD_HOST=0.0.0.0 — a container bound to loopback refuses every probe from outside its own namespace"; exit 1; }
      - name: The HEALTHCHECK is declared, and reads its port at runtime
        # Read off the IMAGE, not re-typed into `docker run`: an assertion that
        # re-states the expression stays green when the HEALTHCHECK line is
        # deleted, which is the one regression worth catching here.
        run: |
          HC=$(docker inspect --format '{{json .Config.Healthcheck}}' muninn:default)
          echo "$HC"
          case "$HC" in
            *DASHBOARD_PORT*) ;;
            *) echo "::error::the image declares no HEALTHCHECK reading DASHBOARD_PORT"; exit 1 ;;
          esac
          case "$HC" in
            */api/live*) ;;
            *) echo "::error::the HEALTHCHECK does not probe /api/live (the dependency-free open-zone path)"; exit 1 ;;
          esac
      - name: Build the serving-profile image (both args off)
        run: docker build --build-arg WITH_MEDIA=false --build-arg WITH_CLI=false -t muninn:nais .
      - name: Serving-profile image carries NEITHER
        run: |
          if docker run --rm --entrypoint sh muninn:nais -c 'command -v ffmpeg'; then
            echo "::error::ffmpeg is present despite WITH_MEDIA=false"; exit 1
          fi
          if docker run --rm --entrypoint sh muninn:nais -c 'command -v claude'; then
            echo "::error::the Claude CLI is present despite WITH_CLI=false"; exit 1
          fi
      - name: A build arg that is neither true nor false FAILS the build
        # Both args are read as `= "true"`, so an unvalidated `WITH_CLI=0` would
        # quietly produce a CLI-less image nobody asked for.
        run: |
          if docker build --build-arg WITH_CLI=0 -t muninn:bogus . >bogus.log 2>&1; then
            echo "::error::a bogus build arg was accepted"; exit 1
          fi
          grep -q "expected true or false" bogus.log \
            || { echo "::error::the build failed, but not on the build-arg check"; cat bogus.log; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: muninn
          POSTGRES_PASSWORD: muninn
          POSTGRES_DB: muninn
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U muninn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The e2e servers boot the real `src/index.ts`, which requires this and
      # nothing else (`requireEnv` in `src/config.ts` names exactly one variable).
      # `muninn_test`, not `muninn`: the schema comes from `db:setup:test`, which
      # is the ONLY thing that applies `db/init.sql`. `db:migrate` alone fails on
      # a bare service container (`relation "messages" does not exist`) — locally
      # docker-compose mounts `init.sql` as the entrypoint, and a GitHub service
      # container has no such hook.
      DATABASE_URL: postgresql://muninn:muninn@127.0.0.1:5435/muninn_test
      LOG_DIR: none
      # No `TELEGRAM_BOT_TOKEN_*` here, deliberately: `e2eEnv()` blanks them on a
      # developer's machine, and a runner should have nothing to blank. If a token
      # is ever needed for a spec, it does NOT belong in this env — an e2e server
      # holding a live token fights the production bot for Telegram.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `--with-deps` pulls the system libraries headless chromium needs on the
      # runner image. Only chromium: `playwright.config.ts` defines one project.
      - run: bunx playwright install --with-deps chromium
      # The schema has to exist before the first server boots — the dashboard and
      # /chat routes query it on the very first request. `db:setup:test` reaches
      # the server through its own hardcoded admin URL, so it needs no env of its
      # own; it creates `muninn_test`, applies `init.sql` and baselines.
      - run: bun run db:setup:test
      # A fresh database makes `chat.spec.ts`/`inspector.spec.ts` FAIL (no user to
      # select) and makes the traces + inspector cases SKIP THEMSELVES, which is
      # the worse half — a green run with the coverage silently gone. The seed is
      # idempotent and lives in `scripts/seed-e2e-db.ts`, which says why.
      - run: bun run db:seed:e2e
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # `test-results/` is where the list reporter drops each failure's
          # error-context.md; without it a red CI run says a locator timed out and
          # nothing about what the page actually contained.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
