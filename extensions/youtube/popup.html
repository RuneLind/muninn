<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>YT Summarizer</h1>
    </header>

    <div id="not-video" class="message hidden">
      <p>Navigate to a YouTube video to summarize it.</p>
    </div>

    <div id="video-info" class="hidden">
      <div class="video-title" id="video-title"></div>
      <label class="opt kind" id="lbl-kind" title="Which summary this capture writes. Deep runs the bigger model with the bot's full thinking budget and takes noticeably longer.">
        Kind
        <select id="sel-kind"></select>
      </label>
      <!-- Why the picker looks the way it does: Muninn could not be reached, or
           a remembered kind is no longer offered. Rendered only here, inside the
           capture panel, because a note about a picker is unreadable on a tab
           that shows no picker. -->
      <div id="options-note" class="note hidden"></div>
      <div class="controls">
        <button id="btn-summarize" class="primary">Summarize</button>
        <!-- This title is the ONE copy of the usable-tick tooltip: popup.js
             reads it off the DOM at load and restores it after a dimmed tick,
             so editing it here is enough. -->
        <label class="opt" id="lbl-frames" title="Pull one frame per cadence tick (~20s on a 10-minute video, ~180s at the 3-hour cap) and let the summary quote the frames that help explain, compare, verify or revisit a point. Adds a download and a few minutes.">
          <input type="checkbox" id="chk-frames"> Slides
        </label>
      </div>
      <!-- How much of the video the summary may SHOW. Revealed only while
           Slides is ticked, because with no frames there is nothing to choose
           between. Its own axis, not a summary kind: Deep works with either. -->
      <label class="opt kind hidden" id="lbl-visual" title="Selected quotes up to 8 visuals inline. Detailed keeps up to 20 in total — 8 inline and the rest under a Visual reference section with captions.">
        Visuals
        <select id="sel-visual"></select>
      </label>
      <!-- Why the Slides tick is dimmed, when it is. -->
      <div id="frames-note" class="note hidden"></div>
      <div id="status" class="hidden"></div>
    </div>
  </div>

  <footer>
    <a href="#" id="open-options">Settings</a>
  </footer>

  <!-- A MODULE: popup.js imports capture-rules.js, the repo-tested rule
       module emitted by `bun run build:extension`. -->
  <script type="module" src="popup.js"></script>
</body>
</html>
